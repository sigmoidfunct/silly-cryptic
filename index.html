<!DOCTYPE html>
<html>
<head>
    <title>Silly Cryptic</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Silly Cryptic</h1>

  <!-- clue display -->
  <div id="clue"></div>

  <!-- answer text box -->
  <div id="answer">
    <input type="text" placeholder="answer">
  </div>

  <!-- buttons -->
  <div id="buttons">
    <button id="hints-button">hints</button>
    <button id="check" onclick="checkAnswer()">check</button>
    <button id="next" onclick="nextQuestion()">next</button>
  </div>

  <div id="result"></div>

  <div id="hint-popup" class="hidden">
      <div class="hint-box">
          <button id="close-hints">×</button>
          <p>Select a hint</p>
          <div class="hint-list">
            <div>
              <button class="hint definition">show definition</button>
              <p class="hint-text"></p>
            </div>
            <div>
              <button class="hint indicators">show indicators</button>
              <p class="hint-text"></p>
            </div>
            <div>
              <button class="hint fodder">show fodder</button>
              <p class="hint-text"></p>
            </div>
        </div>
      </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
